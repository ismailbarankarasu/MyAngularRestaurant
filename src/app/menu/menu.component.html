<div class="container-xxl py-5" id="menu">
  <div class="container">

    <!-- Section Title -->
    <div
      class="text-center wow fadeInUp"
      data-wow-delay="0.1s"
    >
      <h5
        class="section-title ff-secondary text-center text-primary fw-normal"
      >
        Yemek Menümüz
      </h5>

      <h1 class="mb-5">
        En Popüler Ürünler
      </h1>
    </div>


    <!-- Tabs -->
    <div
      class="tab-class text-center wow fadeInUp"
      data-wow-delay="0.1s"
    >

<ul class="nav nav-pills d-inline-flex justify-content-center border-bottom mb-5 flex-wrap">

  <li
    *ngFor="let category of categories"
    class="nav-item"
  >

    <button
      type="button"
      class="category-tab d-flex align-items-center text-start mx-2 px-3 pb-3"
      [ngClass]="{
        'active': selectedTab === category.id
      }"
      (click)="selectTab(category.id)"
    >

      <i
        class="fas fa-2x text-primary category-icon"
        [ngClass]="getCategoryIcon(category.categoryName)"
      ></i>

      <div class="ps-3">

        <h6 class="category-title mb-0">
          {{ category.categoryName }}
        </h6>

      </div>

    </button>

  </li>

</ul>


      <!-- Tab Content -->
      <div [ngSwitch]="selectedTab">

        <div *ngFor="let category of categories">

          <div
            *ngSwitchCase="category.id"
            class="tab-content"
          >

            <!--
              Tek row içerisinde tüm ürünler.
              col-lg-6 sayesinde masaüstünde 2 ürün yan yana.
            -->
            <div class="row g-4">

              <div
                *ngFor="let menu of category.menus"
                class="col-lg-6 col-md-12"
              >

                <div class="d-flex align-items-center h-100">

                  <!-- Product Image -->
                  <img
                    class="menu-product-image flex-shrink-0 rounded"
                    [src]="menu.imageUrl"
                    [alt]="menu.title"
                  >

                  <!-- Product Info -->
                  <div class="w-100 d-flex flex-column text-start ps-4">

                    <h5
                      class="d-flex justify-content-between
                             border-bottom pb-2 mb-2"
                    >

                      <span>
                        {{ menu.title }}
                      </span>

                      <span class="text-primary">
                        {{ menu.price | currency:'TRY':'symbol-narrow' }}
                      </span>

                    </h5>

                    <small class="fst-italic text-muted">
                      {{ menu.description }}
                    </small>

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>
</div>

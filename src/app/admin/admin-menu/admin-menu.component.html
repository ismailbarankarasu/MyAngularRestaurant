<div class="container mt-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Menü Yönetimi</h3>
    <button type="button" class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#createModal">
      <i class="fas fa-plus me-2"></i> Yeni Ürün
    </button>
  </div>

  <!-- Search and Filter Section -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="input-group">
        <span class="input-group-text">
          <i class="fas fa-search"></i>
        </span>
        <input type="text" class="form-control" placeholder="Ürün ara...">
      </div>
    </div>
    <div class="col-md-3">
      <select class="form-select">
        <option value="">Tüm Kategoriler</option>
        <option *ngFor="let category of categoryList" [value]="category.id">
          {{category.categoryName}}
        </option>
      </select>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Resim</th>
          <th>Başlık</th>
          <th>Fiyat</th>
          <th>Kategori</th>
          <th class="text-center">İşlemler</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of menuList; let i = index">
          <td>{{i+1}}</td>
          <td>
            <img [src]="item.imageUrl" alt="{{item.title}}" class="menu-img"
                 style="height: 75px; width: 75px;">
          </td>
          <td>{{item.title | titlecase }}</td>
          <td>{{item.price | currency:'₺' }}</td>
          <td>
            <span class="badge bg-info">{{item.category.categoryName}}</span>
          </td>
          <td class="text-center">
            <div class="btn-group">
              <button (click)="onSelected(item)" class="btn btn-info"
                      data-bs-toggle="modal" data-bs-target="#editModal">
                <i class="fas fa-edit me-1"></i> Güncelle
              </button>
              <button (click)="delete(item.id)" class="btn btn-danger ms-2">
                <i class="fas fa-trash me-1"></i> Sil
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Create Modal -->
  <div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form #createForm="ngForm" (ngSubmit)="create(); createForm.resetForm()">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Yeni Ürün Ekle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Ürün Başlığı</label>
                  <input type="text" name="title" class="form-control" [(ngModel)]="menu.title">
                  <div *ngIf="errors?.Title" class="text-danger">
                    <span *ngFor="let error of errors.Title">{{error}}</span>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Ürün Fiyatı</label>
                  <input type="number" name="price" class="form-control" [(ngModel)]="menu.price">
                  <div *ngIf="errors?.Price" class="text-danger">
                    <span *ngFor="let error of errors.Price">{{error}}</span>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Kategori</label>
                  <select [(ngModel)]="menu.categoryId" name="categoryId" class="form-select">
                    <option value="">Kategori Seçin</option>
                    <option *ngFor="let category of categoryList" [value]="category.id">
                      {{category.categoryName}}
                    </option>
                  </select>
                  <div *ngIf="errors?.CategoryId" class="text-danger">
                    <span *ngFor="let error of errors.CategoryId">{{error}}</span>
                  </div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Ürün Açıklaması</label>
                  <textarea name="description" class="form-control" [(ngModel)]="menu.description"
                           rows="4"></textarea>
                  <div *ngIf="errors?.Description" class="text-danger">
                    <span *ngFor="let error of errors.Description">{{error}}</span>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Ürün Resmi</label>
                  <input type="text" name="imageUrl" [(ngModel)]="menu.imageUrl" class="form-control">
                  <div *ngIf="errors?.ImageUrl" class="text-danger">
                    <span *ngFor="let error of errors.ImageUrl">{{error}}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
            <button type="submit" class="btn btn-primary" [disabled]="createForm.invalid">
              <i class="fas fa-save me-1"></i> Kaydet
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form #editForm="ngForm" (ngSubmit)="update()">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Ürün Güncelle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Ürün Başlığı</label>
                  <input type="text" name="title" class="form-control" [(ngModel)]="editMenu.title" required>
                </div>

                <div class="form-group">
                  <label class="form-label">Ürün Fiyatı</label>
                  <input type="number" name="price" class="form-control" [(ngModel)]="editMenu.price" required>
                </div>

                <div class="form-group">
                  <label class="form-label">Kategori</label>
                  <select [(ngModel)]="editMenu.categoryId" name="categoryId" class="form-select">
                    <option *ngFor="let category of categoryList" [value]="category.id">
                      {{category.categoryName}}
                    </option>
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Ürün Açıklaması</label>
                  <textarea name="description" class="form-control" [(ngModel)]="editMenu.description"
                           rows="4" required></textarea>
                </div>

                <div class="form-group">
                  <label class="form-label">Ürün Resmi</label>
                  <input type="text" name="imageUrl" class="form-control" [(ngModel)]="editMenu.imageUrl" required>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
            <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || !editForm.dirty">
              <i class="fas fa-save me-1"></i> Güncelle
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

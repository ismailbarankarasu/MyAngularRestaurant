<div class="container">
  <table class="table table-hover">
   <thead>
     <tr>
       <th>#</th>
       <th>Kategori Adı</th>
       <th>İşlemler</th>
      </tr>
   </thead>
   <tbody>
    <tr *ngFor="let item of categoryList; let i = index">
      <td>{{i+1}}</td>
      <td>{{item.categoryName}}</td>
      <td>
       <a class="btn btn-danger" style="margin-right: 5px;" (click)="delete(item.id)">Sil</a>
       <a class="btn btn-info" data-bs-toggle="modal" (click)="onSelected(item)" data-bs-target="#editModal">Güncelle</a>
      </td>
  </tr>
  </tbody>
  </table>

  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
    Yeni Kategori
  </button>
</div>
<!-- Create Modal -->
<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form #createForm="ngForm" (ngSubmit)="create(); createForm.resetForm()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createModalLabel">Yeni Kategori Ekle</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
       <div class="modal-body">
        <div class="form-group">
          <label>Kategori Adı</label>
          <input type="text" name="categoryName" class="form-control mb-3" [(ngModel)]="category.categoryName" required="">
        </div>
       </div>
       <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
          <button type="submit" class="btn btn-primary" [disabled]="createForm.invalid" data-bs-dismiss="modal">Kaydet</button>
       </div>
     </div>
  </form>
  </div>
</div>

<!--Update Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form #editForm="ngForm" (ngSubmit)="update();">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Yeni Kategori Ekle</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
       <div class="modal-body">
        <div class="form-group">
          <label>Kategori Adı</label>
          <input type="text" name="categoryName" class="form-control mb-3" [(ngModel)]="editCategory.categoryName" required="">
        </div>
       </div>
       <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
          <button type="submit" class="btn btn-primary" data-bs-dismiss="modal" [disabled]="editForm.invalid || !editForm.dirty">Güncelle</button>
       </div>
     </div>
  </form>
  </div>
</div>

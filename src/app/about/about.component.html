<div class="container-xxl py-5" id="about" *ngIf="about">
  <div class="container">
    <div class="row g-5 align-items-center">

      <div class="col-lg-6">
        <div class="row g-3">

          <div class="col-6 text-start">
            <img
              class="img-fluid rounded w-100 wow zoomIn"
              data-wow-delay="0.1s"
              src="assets/img/about-1.jpg"
              alt="Restaurant"
            >
          </div>

          <div class="col-6 text-start">
            <img
              class="img-fluid rounded w-75 wow zoomIn"
              data-wow-delay="0.3s"
              src="assets/img/about-2.jpg"
              style="margin-top: 25%;"
              alt="Restaurant"
            >
          </div>

          <div class="col-6 text-end">
            <img
              class="img-fluid rounded w-75 wow zoomIn"
              data-wow-delay="0.5s"
              src="assets/img/about-3.jpg"
              alt="Restaurant"
            >
          </div>

          <div class="col-6 text-end">
            <img
              class="img-fluid rounded w-100 wow zoomIn"
              data-wow-delay="0.7s"
              src="assets/img/about-4.jpg"
              alt="Restaurant"
            >
          </div>

        </div>
      </div>

      <div class="col-lg-6">

        <h5 class="section-title ff-secondary text-start text-primary fw-normal">
          About Us
        </h5>

        <h1 class="mb-4">
          {{ about.title }}
        </h1>

        <p class="mb-4">
          {{ about.description }}
        </p>

      </div>

    </div>
  </div>
</div>

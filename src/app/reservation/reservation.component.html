<div class="container-xxl py-5 px-0 wow fadeInUp" data-wow-delay="0.1s">
  <div class="row g-0">

    <!-- Sol Görsel Alanı -->
    <div class="col-md-6">
      <div class="reservation-image h-100">
        <img
          src="https://www.protel.com.tr/blog/wp-content/uploads/2021/09/masa-rezervasyon.jpg"
          alt="Restoran Rezervasyon"
          class="w-100 h-100"
        >
      </div>
    </div>

    <!-- Rezervasyon Formu -->
    <div class="col-md-6 bg-dark d-flex align-items-center">
      <div class="p-5 wow fadeInUp w-100" data-wow-delay="0.2s">

        <h5 class="section-title ff-secondary text-start text-primary fw-normal">
          Rezervasyon
        </h5>

        <h1 class="text-white mb-4">
          Online Masa Rezervasyonu
        </h1>

        <!-- Başarılı Mesaj -->
        <div
          *ngIf="successMessage"
          class="alert alert-success"
        >
          {{ successMessage }}
        </div>

        <!-- Hata Mesajı -->
        <div
          *ngIf="errorMessage"
          class="alert alert-danger"
        >
          {{ errorMessage }}
        </div>

        <form
          #reservationForm="ngForm"
          (ngSubmit)="createReservation(reservationForm)"
          novalidate
        >

          <div class="row g-3">

            <!-- Ad Soyad -->
            <div class="col-md-6">

              <div class="form-floating">

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Adınız Soyadınız"
                  [(ngModel)]="reservation.name"
                  #name="ngModel"
                  required
                  minlength="3"
                >

                <label for="name">
                  Adınız Soyadınız
                </label>

              </div>

              <div
                *ngIf="name.invalid && name.touched"
                class="text-warning small mt-1"
              >
                Ad soyad en az 3 karakter olmalıdır.
              </div>

            </div>


            <!-- E-posta -->
            <div class="col-md-6">

              <div class="form-floating">

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="E-posta Adresiniz"
                  [(ngModel)]="reservation.email"
                  #email="ngModel"
                  required
                  email
                >

                <label for="email">
                  E-posta Adresiniz
                </label>

              </div>

              <div
                *ngIf="email.invalid && email.touched"
                class="text-warning small mt-1"
              >
                Geçerli bir e-posta adresi giriniz.
              </div>

            </div>


            <!-- Tarih ve Saat -->
            <div class="col-md-6">

              <div class="form-floating">

                <input
                  type="datetime-local"
                  class="form-control"
                  id="reservationDate"
                  name="reservationDate"
                  [(ngModel)]="reservation.reservationDate"
                  #reservationDate="ngModel"
                  required
                >

                <label for="reservationDate">
                  Tarih ve Saat
                </label>

              </div>

              <div
                *ngIf="reservationDate.invalid && reservationDate.touched"
                class="text-warning small mt-1"
              >
                Rezervasyon tarihi seçmelisiniz.
              </div>

            </div>


            <!-- Kişi Sayısı -->
            <div class="col-md-6">

              <div class="form-floating">

                <select
                  class="form-select"
                  id="personCount"
                  name="personCount"
                  [(ngModel)]="reservation.personCount"
                  #personCount="ngModel"
                  required
                >

                  <option [ngValue]="1">1 Kişi</option>
                  <option [ngValue]="2">2 Kişi</option>
                  <option [ngValue]="3">3 Kişi</option>
                  <option [ngValue]="4">4 Kişi</option>
                  <option [ngValue]="5">5 Kişi</option>
                  <option [ngValue]="6">6 Kişi</option>
                  <option [ngValue]="7">7 Kişi</option>
                  <option [ngValue]="8">8 Kişi</option>
                  <option [ngValue]="9">9 Kişi</option>
                  <option [ngValue]="10">10 Kişi</option>

                </select>

                <label for="personCount">
                  Kişi Sayısı
                </label>

              </div>

            </div>


            <!-- Özel İstek -->
            <div class="col-12">

              <div class="form-floating">

                <textarea
                  class="form-control"
                  placeholder="Özel İsteğiniz"
                  id="specialRequest"
                  name="specialRequest"
                  [(ngModel)]="reservation.specialRequest"
                  maxlength="500"
                  style="height: 100px;"
                ></textarea>

                <label for="specialRequest">
                  Özel İsteğiniz
                </label>

              </div>

            </div>


            <!-- Submit -->
            <div class="col-12">

              <button
                class="btn btn-primary w-100 py-3"
                type="submit"
                [disabled]="isSubmitting"
              >

                <span *ngIf="!isSubmitting">
                  Rezervasyon Yap
                </span>

                <span *ngIf="isSubmitting">
                  Rezervasyon Oluşturuluyor...
                </span>

              </button>

            </div>

          </div>

        </form>

      </div>
    </div>

  </div>
</div>
